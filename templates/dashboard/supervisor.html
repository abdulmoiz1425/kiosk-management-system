{% extends 'base.html' %}
{% block title %}Supervisor Dashboard — Wafaa Tech{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0" style="color: var(--wt-dark);">
        <i class="bi bi-clipboard-check me-2"></i>Supervisor Dashboard
    </h4>
    <span class="text-muted small">{{ today|date:"l, d F Y" }}</span>
</div>

<div class="row g-3 mb-4">
    <div class="col-6 col-md-4">
        <div class="stat-card">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <div class="stat-value">—</div>
                    <div class="stat-label">My Visits This Month</div>
                </div>
                <i class="bi bi-geo-alt stat-icon"></i>
            </div>
        </div>
    </div>
    <div class="col-6 col-md-4">
        <div class="stat-card">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <div class="stat-value">—</div>
                    <div class="stat-label">Avg. Rating Given</div>
                </div>
                <i class="bi bi-star stat-icon"></i>
            </div>
        </div>
    </div>
    <div class="col-6 col-md-4">
        <div class="stat-card">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <div class="stat-value">—</div>
                    <div class="stat-label">Bonus/Penalty Issued</div>
                </div>
                <i class="bi bi-cash-coin stat-icon"></i>
            </div>
        </div>
    </div>
</div>

<div class="card card-wt">
    <div class="card-header">
        <i class="bi bi-clock-history me-2"></i>Recent Visits
    </div>
    <div class="card-body">
        <p class="text-muted text-center py-4">
            <i class="bi bi-map fs-2 d-block mb-2"></i>
            No visits logged yet.
        </p>
    </div>
</div>
{% endblock %}
