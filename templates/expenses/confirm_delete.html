{% extends 'base.html' %}
{% block title %}Delete Expense — Wafaa Tech{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-5">
    <div class="card card-wt">
      <div class="card-header text-danger">
        <i class="bi bi-exclamation-triangle me-2"></i>Confirm Delete
      </div>
      <div class="card-body p-4 text-center">
        <p class="fs-5 mb-1">Delete this expense?</p>
        <p class="fw-bold fs-5 mb-1" style="color:var(--wt-dark);">{{ expense.get_category_display }} — {{ expense.amount }} RM</p>
        <p class="text-muted small mb-4">{{ expense.description }} — {{ expense.date }}</p>
        <form method="post" class="d-flex gap-3 justify-content-center">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger px-4"><i class="bi bi-trash me-2"></i>Delete</button>
          <a href="{% url 'expenses:add' %}" class="btn btn-outline-secondary px-4">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
